name: Matchday Ping

# ---- v75(2026年9月1日)「直前オッズ効果の計測が2週間0件」の根本対策① ----
#
# 何の仕組みか:
#   キックオフ10〜70分前の「確定スタメン+直前オッズ」観測(v57のスタメン確定
#   ウォッチ)は、これまで**サイトに誰かがアクセスした時だけ**動いていました。
#   個人サイトでは試合直前にちょうど訪問がある保証がなく、さらにRenderの
#   無料プランはアクセスが無いと休止するため、観測が2週間で0件のままでした。
#
# このワークフローがやること:
#   試合が行われやすい時間帯に10分おきにサイトの軽量ページ(/api/health)を
#   1回叩くだけ。これでRenderが目を覚まし、サーバー内の自走タイマー(対策②・
#   server.js側)が窓内の試合を観測します。シークレット設定は不要です。
#
# 時間帯の設計(UTC):
#   ・平日 16:00〜21:59 … 欧州のナイトゲーム帯(日本時間 深夜1〜7時)
#   ・土日 11:00〜22:59 … ランチキックオフ〜ナイトゲーム帯
#   これで欧州主要リーグの大半のキックオフをカバーします(早朝の特殊開催は対象外。
#   すべての時間を常時カバーしない理由: GitHub Actionsの無料枠と、
#   「必要な時間だけ起こす」という省エネ設計のため)。
#
# 費用: GitHub Actions無料枠内(1回あたり数秒×週300回程度)。
#       Render無料プランの月間稼働時間(750時間)にも収まります。

on:
  schedule:
    - cron: "*/10 16-21 * * 1-5"   # 平日の欧州ナイトゲーム帯
    - cron: "*/10 11-22 * * 0,6"   # 土日のランチ〜ナイト帯
  workflow_dispatch: {}             # 手動でも試せるように

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake the server (lineup watch tick)
        run: |
          # /api/health は公開の軽量エンドポイント。応答コードだけ記録する。
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 \
            "https://soccer-analysis-ai-proxy.onrender.com/api/health?src=matchday-ping" || echo "000")
          echo "health status: $code"
          # 休止からの初回は起動に時間がかかり000/5xxになり得るが、
          # それ自体が「起こす」役目を果たしているため失敗扱いにしない。
          exit 0
