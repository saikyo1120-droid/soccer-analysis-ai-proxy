name: Matchday Ping

# ---- v75(2026年9月1日)「直前オッズ効果の計測が2週間0件」の根本対策① ----
# ---- v77(2026年9月1日)「コールドスタート撲滅」へ拡張(利用者の承認) ----
#
# 何の仕組みか:
#   Renderの無料プランは15分アクセスが無いと休止し、次に来た人は起動に
#   最大1分待たされます(初めての訪問者はここで帰ってしまう=集客の敵)。
#   このワークフローは10分おきにサイトの軽量ページ(/api/health)を1回叩いて
#   サーバーを起こしておきます。ついでに、サーバー内の自走タイマー(v75・
#   server.js側)が試合直前の「確定スタメン+直前オッズ」観測を行います。
#   シークレット設定は不要です。
#
# 時間帯の設計(UTC・v77で「ほぼ終日」へ拡張):
#   ・毎日 0:00〜19:59 と 22:00〜23:59 … ほぼ終日カバー
#   ・毎日 20:00〜21:59(日本時間の朝5〜7時)だけ休ませる
#     → Render無料枠は月750時間まで。完全24時間だと31日の月に744時間となり
#       余裕が6時間しかない(超えると月末にサービス停止の危険)。日本の利用者が
#       最も少ない早朝2時間を休ませ、31日の月でも約700時間に収める。
#   ・土日はその2時間もカバーする(欧州の夜遅い試合の観測用。これを足しても
#     月合計は最大約705時間(週末が10日ある31日の月)で、無料枠内に収まる)
#
# 費用: GitHub Actions無料枠内(公開リポジトリ)。
# 注意: GitHubの仕様で、リポジトリに60日間コミットが無いと定期実行が自動停止
#       されます(その場合はActionsタブから手動で再有効化できます)。

on:
  schedule:
    - cron: "*/10 0-19,22-23 * * *"   # 毎日ほぼ終日(日本時間の早朝2時間だけ休止)
    - cron: "*/10 20-21 * * 0,6"      # 土日は休止時間もカバー(欧州の夜試合の観測)
  workflow_dispatch: {}               # 手動でも試せるように

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake the server (keep-awake + lineup watch tick)
        run: |
          # /api/health は公開の軽量エンドポイント。応答コードだけ記録する。
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 \
            "https://soccer-analysis-ai-proxy.onrender.com/api/health?src=matchday-ping" || echo "000")
          echo "health status: $code"
          # 休止からの初回は起動に時間がかかり000/5xxになり得るが、
          # それ自体が「起こす」役目を果たしているため失敗扱いにしない。
          exit 0
