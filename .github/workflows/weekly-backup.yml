name: Weekly Learning-State Backup

# 「AIの脳」(学習済みの重み・精度/ROI/知能の履歴・較正・使用実績)を週1回、
# このリポジトリの backups/ フォルダへ自動保存する仕組みです。
# 学習データはすべてUpstash(無料プラン)1箇所に保存されているため、万一の
# データ消失時にAIが「全部忘れる」ことを防ぎます。知識アイテム本体は含みません
# (API-Footballから数日で自動再収集できる派生データのため)。
#
# 事前準備: daily-learning.yml と同じ2つのSecretsを使います(追加設定は不要)。
#   LEARNING_ENDPOINT_URL … 例) https://soccer-analysis-ai-proxy.onrender.com/api/learning/run-daily
#   LEARNING_SECRET_KEY   … Renderの環境変数 AUTO_COLLECT_SECRET と同じ値

on:
  schedule:
    # 00分は混雑で遅延するため41分にずらす(daily-learning.ymlと同じ理由)
    - cron: "41 21 * * 0" # 毎週日曜 UTC 21:41 = 日本時間 月曜6:41(日次学習の後)
  workflow_dispatch: {} # 手動実行も可能(動作確認用)

permissions:
  contents: write # backups/ へのコミットに必要

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Export learning state
        run: |
          # LEARNING_ENDPOINT_URL は run-daily を指しているため、backup/export に読み替える
          BASE_URL="${{ secrets.LEARNING_ENDPOINT_URL }}"
          EXPORT_URL="${BASE_URL/\/api\/learning\/run-daily//api/backup/export}"
          echo "export from: ${EXPORT_URL}"
          mkdir -p backups
          FILE="backups/backup-$(date -u +%Y-%m-%d).json"
          # ---- v101(2026年11月9日): 不完全なバックアップを「成功」として保存しない ----
          #   本番実測: 10/25 分は重み・成長ログが null のまま ok:true で保存されていた(サーバー側が読み出し
          #   失敗を飲み込んでいた)。サーバー側(v101)は読めなかった/中核が無いとき ok:false + partial:true を返す。
          #   ここでは ①HTTP 200 ②"ok":true ③"partial":true を含まない、の3条件を満たすまで最大3回(60秒おき)
          #   試す。3回とも不完全なら失敗で終わる(GitHub が失敗メールを送る=気づける)。
          ATTEMPT=1
          while :; do
            HTTP_CODE=$(curl -sS -o "${FILE}" -w "%{http_code}" --max-time 120 "${EXPORT_URL}?key=${{ secrets.LEARNING_SECRET_KEY }}" || echo "000")
            echo "attempt ${ATTEMPT}: HTTP ${HTTP_CODE}"
            if [ "${HTTP_CODE}" = "200" ] && grep -q '"ok":true' "${FILE}" && ! grep -q '"partial":true' "${FILE}"; then
              echo "backup content complete"
              break
            fi
            echo "backup incomplete or failed (attempt ${ATTEMPT}):"
            head -c 600 "${FILE}" || true
            echo
            if [ "${ATTEMPT}" -ge 3 ]; then
              echo "::error::バックアップが3回とも不完全でした(保存先の読み出し失敗、または中核の保存値が無い)。不完全なファイルは保存しません。"
              rm -f "${FILE}"
              exit 1
            fi
            ATTEMPT=$((ATTEMPT + 1))
            sleep 60
          done
          ls -la backups/

      - name: Commit backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backups/
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "chore: weekly learning-state backup ($(date -u +%Y-%m-%d))"
          git push
