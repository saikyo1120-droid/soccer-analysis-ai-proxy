name: Predictions Auto-Collect

# 「AI予測の実績」を毎日たくさんの試合ぶん貯めていくための仕組みです。
# これまで POST /api/predictions/auto-collect (今日の試合の予測記録・終了した
# 試合の的中判定) は、実は誰からも定期的に呼び出されておらず(このワークフロー
# ファイル自体が存在していませんでした)、サイトを訪れた人がたまたま「今日の
# 試合」画面を開いた時のおまけ処理でしか記録が増えていませんでした。これが
# 「試合はたくさんあるのに正答率の記録件数が全然増えない」の直接の原因です。
#
# 6時間おき(1日4回)に自動実行することで、毎日安定して新しい予測が記録され、
# 終わった試合の的中判定も進むようにします。
#
# なぜ「1日4回・6時間おき」なのか(API-Football無料プランへの配慮):
#   API-Footballの無料プランは1日100リクエストが上限です。1回の実行で最大
#   12リクエスト程度(サーバー側のAUTO_COLLECT_LOG_CAP/AUTO_COLLECT_RESOLVE_CAP
#   で制限済み)を使うため、1日4回で最大48リクエスト程度に収め、毎日学習エンジン
#   (daily-learning.yml)や、実際にサイトを訪れた利用者の分の余力を残しています。
#   もっと頻繁に・たくさんの試合を追いたい場合は、API-Footballを有料プラン
#   (Pro: $19/月・7,500req/日)に切り替えた上で、このファイルのcronをより
#   短い間隔(例: 1時間おき "0 * * * *")に変更してください。
#
# ---- 2026年8月・本番調査で判明した根本原因への対処(重要) ----
# このワークフローは AUTO_COLLECT_ENDPOINT_URL という **専用のシークレット** を
# 必要としていた。ところが手順書(DEVELOPER_HANDOVER)の「GitHub Secrets」欄には
# LEARNING_ENDPOINT_URL と LEARNING_SECRET_KEY しか書かれておらず、
# このシークレットは登録されていなかった可能性が高い。
# その場合 curl のURLが空文字になり、**エンドポイントは一度も呼ばれない**。
#   → 予測の答え合わせが進まない → ホーム画面の正答率が何日も動かない
# 実際、手動実行しても本番の total/resolved/pending が1件も変化しなかった。
#
# weekly-backup.yml と同じやり方に揃え、**追加のシークレット登録を不要**にする。
# LEARNING_ENDPOINT_URL(daily-learning.yml で既に登録済み)から組み立てる。
# AUTO_COLLECT_ENDPOINT_URL が登録されていればそちらを優先して使う。
#
# 事前準備: daily-learning.yml と同じシークレットだけで動きます。
#     LEARNING_ENDPOINT_URL : 例) https://soccer-analysis-ai-proxy.onrender.com/api/learning/run-daily
#     LEARNING_SECRET_KEY   : Renderの AUTO_COLLECT_SECRET と同じ値
#   (AUTO_COLLECT_ENDPOINT_URL は任意。登録しなくても動きます)

on:
  schedule:
    # 00分は定時実行が世界的に混雑し大幅に遅延するため、37分にずらす(下記の
    # daily-learning.ymlと同じ理由。2026-08-05に3時間42分の遅延を実測)。
    - cron: "37 */6 * * *" # 6時間おき(UTC 0/6/12/18時の37分)= 1日4回
  workflow_dispatch: {} # 「Actions」タブから手動実行もできるようにしておく(動作確認用)

jobs:
  run-auto-collect:
    runs-on: ubuntu-latest
    steps:
      - name: Call the predictions auto-collect endpoint
        run: |
          # ---- 呼び出し先の決定(専用シークレット無しでも動くようにする) ----
          URL="${AUTO_COLLECT_ENDPOINT_URL}"
          if [ -z "$URL" ] && [ -n "$LEARNING_ENDPOINT_URL" ]; then
            URL="${LEARNING_ENDPOINT_URL%/api/learning/run-daily}/api/predictions/auto-collect"
            echo "AUTO_COLLECT_ENDPOINT_URL が未登録のため、LEARNING_ENDPOINT_URL から組み立てました。"
          fi
          if [ -z "$URL" ]; then
            echo "::error::呼び出し先のURLが決まりません。Settings → Secrets and variables → Actions で LEARNING_ENDPOINT_URL(例: https://soccer-analysis-ai-proxy.onrender.com/api/learning/run-daily)を登録してください。"
            exit 1
          fi
          if [ -z "$LEARNING_SECRET_KEY" ]; then
            echo "::error::LEARNING_SECRET_KEY が未登録です。Renderの環境変数 AUTO_COLLECT_SECRET と同じ値を登録してください。"
            exit 1
          fi
          # URL自体はシークレットではないので、どこを叩いたか分かるように出す
          # (キーは絶対に出さない)
          echo "呼び出し先: $URL"

          call() {
            curl -sS -X POST "${URL}?key=${LEARNING_SECRET_KEY}" \
              --max-time 90 -w "\nHTTP status: %{http_code}\n" -o response.json || true
            cat response.json || true
          }
          call
          # Renderの無料プランはアクセスが無いとスリープするため、初回リクエストの
          # 起動待ちで失敗することがある。念のためもう一度だけ叩き直す。
          if ! grep -q '"ok":true' response.json 2>/dev/null; then
            echo "1回目が失敗した可能性があるため、60秒待って再試行します"
            sleep 60
            call
          fi
          # リトライ後の最終結果を必ず確認する(失敗を成功として通さない)
          if ! grep -q '"ok":true' response.json 2>/dev/null; then
            echo "::error::予測自動収集の呼び出しに失敗しました。上の response.json と HTTP status を確認してください。403 の場合は LEARNING_SECRET_KEY と Render の AUTO_COLLECT_SECRET が一致していません。"
            exit 1
          fi
          # ---- 2026年8月の監査で追加: 何件処理したのかをログに残す ----
          #   「Successなのに1件も進んでいない」を見逃さないため、
          #   ログ・答え合わせ・除外の件数をワークフローの要約に出す。
          echo "### 予測の自動収集 結果" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat response.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
        env:
          AUTO_COLLECT_ENDPOINT_URL: ${{ secrets.AUTO_COLLECT_ENDPOINT_URL }}
          LEARNING_ENDPOINT_URL: ${{ secrets.LEARNING_ENDPOINT_URL }}
          LEARNING_SECRET_KEY: ${{ secrets.LEARNING_SECRET_KEY }}
