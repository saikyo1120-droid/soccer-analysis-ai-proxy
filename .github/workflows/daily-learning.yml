name: Daily Learning Engine

# 「毎日学習エンジン」を毎日決まった時間に自動実行するための仕組みです。
# GitHub Actionsは無料で使えるスケジューラで、新しいアカウント登録は不要です
# (このリポジトリのGitHubアカウントでそのまま動きます)。
#
# 毎日 日本時間4:00(UTC 19:00、前日)に、本番サイトの
# POST /api/learning/run-daily?key=<秘密のキー> を呼び出します。
#
# 事前準備(1回だけ):
#   このリポジトリの Settings → Secrets and variables → Actions →
#   「New repository secret」から、以下の2つを登録してください。
#     LEARNING_ENDPOINT_URL : 例) https://soccer-analysis-ai-proxy.onrender.com/api/learning/run-daily
#     LEARNING_SECRET_KEY   : Renderの環境変数 AUTO_COLLECT_SECRET と同じ値
#   (AUTO_COLLECT_SECRETを設定していない場合はこのワークフローの?key=部分を
#    削除しても動きますが、誰でもこのエンドポイントを叩けてしまうため、
#    AUTO_COLLECT_SECRETの設定を強く推奨します)

on:
  schedule:
    # 2026年8月・本番調査での修正: 以前は "0 19 * * *"(=日本時間4:00ちょうど)
    # だったが、GitHub Actionsの定時実行は「毎時00分」に世界中の予約が集中するため
    # 大幅に遅延する。実際に2026-08-05は4:00指定の実行が7:42に走っていた
    # (3時間42分の遅れ)。混雑を避けるため、00分から外した時刻に変更する。
    - cron: "17 19 * * *" # 毎日 UTC 19:17 = 日本時間 翌4:17
    # 取りこぼし対策の再実行。上の実行が遅延・失敗しても、その日のうちに必ず
    # 一度は学習が走るようにする。
    # ---- v99(2026年11月6日)・本番実測で判明した無駄の修正 ----
    #   「同日2回目は収集の同日ガードが働くので無駄がない」は誤りだった。クラブの核・
    #   予想・モデル調整は飛ぶが、LLMの見解・選手詳細の輪番・最近の試合の取り込み・
    #   保存先の読み書きはまるごと再実行され、Upstash の消費が1日約2.9万コマンド
    #   (10月と同じペース=月間上限50万に 11/22 ごろ到達)になっていた。
    #   サーバー側(v99)が「今日すでに完走していれば alreadyCompleted:true を返して何もしない」
    #   ようになったため、この保険は本当に取りこぼした日だけ学習を走らせる。
    - cron: "43 23 * * *" # 毎日 UTC 23:43 = 日本時間 翌8:43(保険。完走済みなら何もしない)
  workflow_dispatch: {} # 「Actions」タブから手動実行もできるようにしておく(動作確認用)

jobs:
  run-daily-learning:
    runs-on: ubuntu-latest
    # v104.1: 学習の完了を最大60分待つため、ジョブ全体の上限を明示する(既定の6時間まで居座らない)
    timeout-minutes: 80
    steps:
      # 2026年8月・本番調査で発見された不具合の修正: 以前はこのリクエストが
      # 「学習ジョブが完全に終わるまで」応答を返さなかったため、実際の本番データ
      # (11クラブぶんの外部API呼び出し+LLM生成)ではこの処理全体が2分
      # (--max-time)を超えることがあり、GitHub Actions側が待ちきれず
      # exit code 28で失敗し続けていた(サーバー側は実際には処理を続けており、
      # いずれ正常に完了・保存されていた可能性が高い)。
      # サーバー側を「リクエストを受けたら即座に応答し、実処理はバックグラウンドで
      # 継続する」方式に変更したため、ここでの応答は一瞬で返るようになった。
      # そのぶん、以下の手順が変わった:
      #   1. まず呼び出して「開始できたか」だけを確認する(以前より高速)。
      #   2. 実際に処理が完了したかどうかは、少し待ってから/api/growth-logの
      #      実行時刻(ranAt)が本当に「たった今」のものになっているかで確認する
      #      (これが無いと、「呼び出しには成功したが実際には裏で失敗していた」
      #      ことに誰も気づけない)。
      - name: Call the daily learning engine endpoint (fire-and-forget)
        id: call
        run: |
          # ---- v104.1(2026年11月14日): 「偽の失敗」メールの原因の修正 その1 ----
          #   完了の判定は「/api/growth-log の ranAt が、この呼び出しより後か」で行う。
          #   ranAt は**学習を開始した時刻**(サーバーがこの呼び出しを受けた時刻)なので、
          #   基準は「呼び出す直前の時刻」でなければならない。従来は基準を「待機ステップの開始時刻」
          #   (=この後の自動収集ステップが終わった後)に取っていたため、自動収集に10秒以上かかった日は
          #   学習が正常に完走しても絶対に合格できなかった。呼び出す直前の時刻を記録して後段へ渡す。
          call_epoch=$(date +%s)
          echo "call_epoch=${call_epoch}" >> "$GITHUB_OUTPUT"
          curl -sS -X POST "${LEARNING_ENDPOINT_URL}?key=${LEARNING_SECRET_KEY}" \
            --max-time 60 \
            --retry 2 \
            --retry-delay 30 \
            -w "\nHTTP status: %{http_code}\n" \
            -o response.json
          cat response.json
          if ! grep -q '"ok":true' response.json; then
            echo "1回目が失敗した可能性があるため、60秒待って再試行します"
            sleep 60
            curl -sS -X POST "${LEARNING_ENDPOINT_URL}?key=${LEARNING_SECRET_KEY}" \
              --max-time 60 -w "\nHTTP status: %{http_code}\n" -o response.json
            cat response.json
          fi
          if ! grep -q '"ok":true' response.json; then
            echo "::error::学習エンジンの呼び出しに失敗しました(応答に \"ok\":true が含まれません)。上のresponse.jsonの内容を確認してください。よくある原因: LEARNING_SECRET_KEYとRenderのAUTO_COLLECT_SECRETの不一致/Render側のエラー。"
            exit 1
          fi
          # ---- v99: サーバーが「本日はすでに完走済み」と答えたら、ここで正常終了する ----
          #   (この後の「完了を待つ」ステップは ranAt の更新を待つため、完走済みの日に
          #    待つと22分後に偽の失敗になる。保険の実行(08:43 JST)は毎日ここに来る想定)
          if grep -q '"alreadyCompleted":true' response.json; then
            echo "本日の学習はすでに完走済みのため、サーバーは何もしませんでした(正常)。"
            echo "### 日次学習: 本日は完走済みのためスキップ(正常)" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat response.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "already_completed=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_completed=false" >> "$GITHUB_OUTPUT"
          fi
          # v104.1: 別のきっかけ(もう一方の予約・自己修復)で既に学習が走っている場合。
          #   その実行の開始時刻はこの呼び出しより前なので、完了の判定では基準時刻を広げる。
          if grep -q '"alreadyRunning":true' response.json; then
            echo "本日の学習は既に実行中でした(この呼び出しでは新しく起動していません)。その完了を待ちます。"
            echo "already_running=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_running=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          LEARNING_ENDPOINT_URL: ${{ secrets.LEARNING_ENDPOINT_URL }}
          LEARNING_SECRET_KEY: ${{ secrets.LEARNING_SECRET_KEY }}

      # ---- 2026年8月7日に追加した二重化 ----
      # Predictions Auto-Collect が「実行機を確保できない(The job was not
      # acquired by Runner of type hosted)」でGitHub側の理由により失敗した実績が
      # あるため、こちらのワークフローからも同じ処理を呼んでおく。
      # 1回あたりの処理量には上限(照合8件・記録3件)があるので、
      # 二重に走ってもAPIの消費が跳ね上がることはない。
      - name: Also run the predictions auto-collect (redundancy)
        continue-on-error: true   # ここが失敗しても日次学習の結果は残す
        run: |
          URL="${LEARNING_ENDPOINT_URL%/api/learning/run-daily}/api/predictions/auto-collect"
          echo "呼び出し先: $URL"
          curl -sS -X POST "${URL}?key=${LEARNING_SECRET_KEY}" \
            --max-time 90 -w "\nHTTP status: %{http_code}\n" -o autocollect.json || true
          cat autocollect.json || true
          echo "### 予測の自動収集(日次学習からの二重化)" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat autocollect.json >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
        env:
          LEARNING_ENDPOINT_URL: ${{ secrets.LEARNING_ENDPOINT_URL }}
          LEARNING_SECRET_KEY: ${{ secrets.LEARNING_SECRET_KEY }}

      - name: Wait for the background job, then verify it actually finished
        # v99: 完走済みでスキップされた日は、待っても ranAt は更新されないので飛ばす
        if: steps.call.outputs.already_completed != 'true'
        run: |
          # ---- v104.1(2026年11月14日): 「偽の失敗」メールの原因の修正 その2 ----
          #   本番実測(11/14): 学習は 27分 で14段階すべて完走していたのに、このステップは
          #   「22分待っても更新されない」として毎日失敗し、GitHub から失敗メールが届いていた。
          #   原因は2つ:
          #     ①待ち時間(22分)が、学習の所要時間(収集対象の拡大で 15分→27分)より短い
          #     ②基準時刻が「このステップの開始」だった(ranAt=学習の開始時刻は、それより必ず前)
          #   直し: 基準は「呼び出す直前の時刻」(上のステップが記録)。待ち時間は最大60分。
          #   学習が既に実行中だった日(alreadyRunning)は、その実行の開始が呼び出しより前なので
          #   基準を4時間前まで広げる(その日のうちに始まった実行の完了を確認できれば合格)。
          CALL_EPOCH="${{ steps.call.outputs.call_epoch }}"
          ALREADY_RUNNING="${{ steps.call.outputs.already_running }}"
          if [ -z "${CALL_EPOCH}" ]; then CALL_EPOCH=$(date +%s); fi
          if [ "${ALREADY_RUNNING}" = "true" ]; then SLACK=14400; else SLACK=120; fi
          THRESHOLD=$((CALL_EPOCH - SLACK))
          echo "バックグラウンドの学習処理が終わるまで待ちます(最大60分)。基準時刻: $(date -u -d "@${THRESHOLD}" +%FT%TZ) 以降に開始した学習の完了を確認します。"
          BASE_URL="${LEARNING_ENDPOINT_URL%/api/learning/run-daily}"
          GROWTH_LOG_URL="${BASE_URL}/api/growth-log"
          PROGRESS_URL="${BASE_URL}/api/learning/progress"
          attempt=0
          # 30秒間隔 x 120回 = 最大60分待つ(本番実測の所要 27分 の約2倍。学習が伸びても偽の失敗にしない)。
          # この30秒ごとのアクセスは、長い収集処理の途中でサーバーが眠るのを防ぐ役目も兼ねている。
          max_attempts=120
          success=0
          while [ $attempt -lt $max_attempts ]; do
            sleep 30
            attempt=$((attempt + 1))
            # サーバーはこの応答を5分キャッシュするため、完了から検知まで最大5分ほど遅れることがある
            curl -sS --max-time 30 "${GROWTH_LOG_URL}?t=$(date +%s)" -o growth.json || true
            ran_at=$(jq -r '.ranAt // empty' growth.json 2>/dev/null || echo "")
            if [ -n "$ran_at" ]; then
              ran_at_epoch=$(date -d "$ran_at" +%s 2>/dev/null || echo 0)
              if [ "$ran_at_epoch" -gt 0 ] && [ "$ran_at_epoch" -ge "$THRESHOLD" ]; then
                echo "確認 ${attempt}/${max_attempts}: 学習の完了を確認しました(開始時刻 ranAt = ${ran_at})"
                success=1
                break
              fi
            fi
            # 10回に1回(5分ごと)、いまどの段階かを表示する(ログを見れば進み具合が分かる)
            if [ $((attempt % 10)) -eq 0 ]; then
              stage=$(curl -sS --max-time 20 "${PROGRESS_URL}?t=$(date +%s)" 2>/dev/null | jq -r '.verdictJa // empty' 2>/dev/null || echo "")
              echo "確認 ${attempt}/${max_attempts}: まだ完了していません(保存済みの最新 ranAt = ${ran_at:-なし})。${stage}"
            fi
          done
          if [ "$success" != "1" ]; then
            echo "---- 学習の進捗(/api/learning/progress)----"
            curl -sS --max-time 20 "${PROGRESS_URL}?t=$(date +%s)" 2>/dev/null | jq -c '{verdictJa, secondsSinceLastStage, dailyLearningRunning, stage: .progress.stage, finished: .progress.finished}' 2>/dev/null || true
            echo "::error::学習ジョブの開始には成功しましたが、60分待っても学習の完了(/api/growth-log の実行時刻の更新)を確認できませんでした。上の「学習の進捗」に、どの段階で止まっているかが出ています。Renderのログも確認してください。この後に処理が完了する場合もあります(サイトの「昨日学んだこと」の日付が今日になっていれば実害はありません)。"
            exit 1
          fi
          {
            echo "### 日次学習: 完了を確認しました"
            echo ""
            echo "- 学習の開始時刻(ranAt): $(jq -r '.ranAt // "不明"' growth.json 2>/dev/null)"
            echo "- 確認までの待ち時間: 約 $((attempt / 2)) 分"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "学習ジョブの完了を確認しました。"
        env:
          LEARNING_ENDPOINT_URL: ${{ secrets.LEARNING_ENDPOINT_URL }}
